services:
  - type: web
    name: pipeline-builder-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_LLM_API_KEY
        sync: false
      - key: VITE_LLM_MODEL
        sync: false
      - key: VITE_LLM_BASE_URL
        sync: false
      - key: VITE_PINECONE_API_KEY
        sync: false
      - key: VITE_PINECONE_INDEX_HOST
        sync: false
      - key: VITE_PINECONE_NAMESPACE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
